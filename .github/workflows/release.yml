name: Create Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.1). If empty, uses root package.json version.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false
  # 手动推送 v* tag 时也直接走发布流程
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.21.0'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            INPUT_VER="${{ inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              VERSION="${INPUT_VER#v}"
            else
              VERSION=$(jq -r .version package.json)
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (tag: ${TAG})"

      - name: Refuse to overwrite an existing release with published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          RELEASE_DATA=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null || true)
          if [ -n "$RELEASE_DATA" ]; then
            ASSETS_COUNT=$(echo "$RELEASE_DATA" | jq '.assets | length')
            if [ "$ASSETS_COUNT" -gt 0 ]; then
              echo "::error::Release ${TAG} already exists with ${ASSETS_COUNT} published assets. Refusing to overwrite."
              echo "::error::Bump the version and create a new tag instead of re-running against an already-published release."
              exit 1
            fi
            echo "Release ${TAG} exists but has no published assets yet. Proceeding with release build."
          else
            echo "Release ${TAG} does not exist yet."
          fi

      - name: Create tag if it does not exist
        if: github.event_name != 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Refusing to reuse a tag that may already point at released assets."
            echo "::error::Bump the version and create a new tag instead."
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build-browser:
    name: Build Browser Bundle
    needs: create-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.release_tag }}

      - name: Sync package versions to release tag
        run: node tools/update-version.mjs "${{ needs.create-tag.outputs.version }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm --filter @nanokvm/browser build

      - name: Create browser archive
        run: |
          cd apps/browser/dist
          zip -r "../nanokvm-usb-browser-${{ needs.create-tag.outputs.release_tag }}.zip" .
          cd ..

      - name: Upload browser artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-release
          path: apps/browser/nanokvm-usb-browser-${{ needs.create-tag.outputs.release_tag }}.zip
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: create-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_script: build:linux-full
            artifact_name: desktop-linux
          - os: windows-latest
            target: windows
            build_script: build:win-full
            artifact_name: desktop-windows
          - os: macos-latest
            target: macos
            build_script: build:mac-full
            artifact_name: desktop-macos
    # 证书/账号 secrets 不再放在 job 级，避免被同矩阵的 Linux/Windows runner 读到。
    # 每个 secret 只在真正需要它的 step 内通过 env/with 注入。
    # macOS 签名/公证在 release 流程中是硬性要求，缺失时直接失败（见下方校验 step）。
    # Windows 签名证书可选，由 Detect 步骤输出后决定走签名还是未签名构建。
    env:
      # 固定缓存目录，避免 Electron / electron-builder 每次重新下载工具链
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.release_tag }}

      - name: Sync package versions to release tag
        run: node tools/update-version.mjs "${{ needs.create-tag.outputs.version }}"

      - name: Cache Electron and electron-builder toolchains
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Detect Windows signing certificate
        id: certs
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify macOS signing/notarization secrets
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$APPLE_CERTIFICATE" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"

          if [ -n "$missing" ]; then
            echo "::error::Missing required macOS signing/notarization secrets:$missing"
            echo "::error::Unsigned macOS release artifacts are not allowed; configure the secrets before releasing."
            exit 1
          fi

          echo "All macOS signing/notarization secrets are present."

      - name: Import macOS code-signing certificate
        if: startsWith(matrix.os, 'macos')
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package (macOS, signed + notarized)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Build desktop package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Build desktop package (Windows, unsigned)
        if: matrix.os == 'windows-latest' && steps.certs.outputs.windows != 'true'
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Build desktop package (Windows, signed)
        if: matrix.os == 'windows-latest' && steps.certs.outputs.windows == 'true'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [create-tag, build-browser, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R release-artifacts

      - name: Create or update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-tag.outputs.release_tag }}
          name: ${{ needs.create-tag.outputs.release_tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
