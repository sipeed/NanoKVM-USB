name: Create Tag and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false
  # 手动推送 v* tag 时也直接走发布流程（tag 必须与 package.json version 一致）
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.21.0'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from root package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${VERSION}"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Pushed tag $GITHUB_REF_NAME does not match package.json version $TAG"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version."

      - name: Create tag if it does not exist
        if: github.event_name != 'push'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, reusing it."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build-browser:
    name: Build Browser Bundle
    needs: create-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm --filter @nanokvm/browser build

      - name: Create browser archive
        run: |
          cd apps/browser/dist
          zip -r "../nanokvm-usb-browser-${{ needs.create-tag.outputs.release_tag }}.zip" .
          cd ..

      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: apps/browser/nanokvm-usb-browser-${{ needs.create-tag.outputs.release_tag }}.zip
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: create-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_script: build:linux-full
            artifact_name: desktop-linux
          - os: windows-latest
            target: windows
            build_script: build:win-full
            artifact_name: desktop-windows
          - os: macos-latest
            target: macos
            build_script: build:mac-full
            artifact_name: desktop-macos
    env:
      # macOS 签名/公证（未配置时 notarize.js 会跳过，产物为未签名）
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows 签名证书（可选）。注意：不能把空值的 CSC_LINK 传给 electron-builder，
      # 否则它会认为要签名并尝试导入空路径（macOS 上会报 "apps/desktop not a file"），
      # 因此只在 Windows + 证书存在时于 build step 内注入。
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Import macOS code-signing certificate
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package (unsigned)
        if: matrix.os != 'windows-latest' || env.WINDOWS_CERTIFICATE == ''
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Build desktop package (signed, Windows)
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          CSC_LINK: ${{ env.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ env.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [create-tag, build-browser, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display structure of downloaded files
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.release_tag }}
          name: ${{ needs.create-tag.outputs.release_tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
