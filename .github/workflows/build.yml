name: Build Browser and Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.21.0'

# 同一分支的重复 push / PR 只保留最新一次构建
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint / format / typecheck / test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  detect-changes:
    name: Detect Changed Paths
    # workflow_dispatch 时不需要过滤，直接全量构建
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            browser:
              - 'apps/browser/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  build-browser:
    name: Build Browser Bundle
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.browser == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm --filter @nanokvm/browser build

      - name: Upload browser dist
        uses: actions/upload-artifact@v4
        with:
          name: browser-dist
          path: apps/browser/dist
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.desktop == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_script: build:linux
            artifact_name: desktop-linux-x64
          - os: windows-latest
            target: windows
            build_script: build:win
            artifact_name: desktop-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm --filter @nanokvm/desktop run ${{ matrix.build_script }}

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
